[pytest]
addopts =
    --browser chromium
    --base-url https://www.demoblaze.com/index.html
    --tracing retain-on-failure
    --screenshot only-on-failure
    --full-page-screenshot
    --video retain-on-failure
    --output test-results
    --html=reports/report.html
    --self-contained-html
    -v
    --strict-markers
testpaths = tests
markers =
    ui: browser-based UI automation tests
    smoke: high-value checks suitable for a quick confidence run
    regression: broader checks for changed application behaviour
    navigation: catalogue, cart, modal, and category navigation checks
    checkout: cart checkout and purchase workflow checks
